name: Windows prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -v
      - run: pyinstaller --noconfirm --onedir --windowed --collect-all ffpyplayer --name VaultVision app.py
      - uses: actions/upload-artifact@v7
        with:
          name: VaultVision-Windows-prototype
          path: dist/VaultVision/
